# Builds an installable Pocketleaf APK on GitHub's servers. No Expo account needed.
# Run it: GitHub → Actions → "Android APK" → Run workflow (or push to main).
# Download it: open the finished run → Artifacts → pocketleaf-apk.
#
# Signing: if the repository has the secrets below, the APK is signed with your
# own key (keep that key: updates must use the same one). Without them it is
# signed with Android's debug key, which installs fine on your own phone.
#   ANDROID_KEYSTORE_BASE64   base64 of a .jks keystore
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner already has the Android SDK; this only accepts its licences.
      # (Its default package list asks for 'tools', which Google has removed.)
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm ci

      - name: Check before building
        run: |
          npm run typecheck
          npm test
          python3 -I replica-tools/sweep.py . --config replica/brand.json

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Use your signing key, if provided
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/app/release.jks
          cat >> android/gradle.properties <<EOF
          POCKETLEAF_STORE_FILE=release.jks
          POCKETLEAF_STORE_PASSWORD=$STORE_PASSWORD
          POCKETLEAF_KEY_ALIAS=$KEY_ALIAS
          POCKETLEAF_KEY_PASSWORD=$KEY_PASSWORD
          EOF
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("android/app/build.gradle")
          s = p.read_text()
          s = s.replace("signingConfigs {", """signingConfigs {
                  pocketleaf {
                      storeFile file(POCKETLEAF_STORE_FILE)
                      storePassword POCKETLEAF_STORE_PASSWORD
                      keyAlias POCKETLEAF_KEY_ALIAS
                      keyPassword POCKETLEAF_KEY_PASSWORD
                  }""", 1)
          s = re.sub(r"(release \{[^}]*?)signingConfig signingConfigs\.debug", r"\1signingConfig signingConfigs.pocketleaf", s, count=1, flags=re.S)
          p.write_text(s)
          PY

      - name: Build the release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v5
        with:
          name: pocketleaf-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
